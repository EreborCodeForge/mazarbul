name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:

jobs:
  quality:
    name: Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Syntax check
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit tests
        run: composer test

      - name: PHPStan
        run: composer analyse

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: quality

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mazarbul
          MYSQL_USER: mazarbul
          MYSQL_PASSWORD: mazarbul
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mazarbul
          POSTGRES_USER: mazarbul
          POSTGRES_PASSWORD: mazarbul
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mazarbul -d mazarbul"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Integration tests
        run: vendor/bin/phpunit --testsuite=Integration --group=integration
