services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mazarbul
      MYSQL_USER: mazarbul
      MYSQL_PASSWORD: mazarbul
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umazarbul", "-pmazarbul"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mazarbul
      POSTGRES_USER: mazarbul
      POSTGRES_PASSWORD: mazarbul
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mazarbul -d mazarbul"]
      interval: 5s
      timeout: 5s
      retries: 20
